<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="hanko.css"><script src="hanko.js"></script>
<style>
  body { width: 1600px; height: 900px; overflow: hidden; }
  #screen { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 1600px; height: 900px; image-rendering: pixelated; }
  #barhost { position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
  .term { position: absolute; left: 14px; bottom: 14px; width: 560px; background: var(--paper); border: 1px solid var(--lineStrong); border-radius: 6px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; color: var(--inkDim); padding: 16px 18px; } .term > div { white-space: pre; }
  .term .p { color: var(--ink); } .term .m { color: var(--inkFaint); } .term .s { color: var(--seal); }
  .colophon { position: absolute; right: 22px; bottom: 18px; font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--inkFaint); text-align: right; line-height: 1.7; }
</style></head><body>
<div id="screen" class="hk">
  <canvas id="wp" width="3200" height="1800"></canvas>
  <div id="barhost"></div>
  <div class="term">
    <div><span class="s">❯</span> <span class="p">omarchy plugin list</span> <span class="m">--kind bar</span></div>
    <div class="m">ID                KIND   STATE     NAME</div>
    <div>omarchy.bar       bar    <span class="m">idle</span>      Omarchy bar</div>
    <div class="p">hanko.bar         bar    active    Hanko</div>
    <div><span class="s">❯</span> <span class="p">omarchy bar use hanko.bar</span></div>
    <div class="m">ok · running head set · 印 stamped</div>
    <div><span class="s">❯</span> <span class="p">▍</span></div>
  </div>
  <div class="colophon">PLATE 03 · 朱印 · DITHER 4×4<br>HANKO / OMARCHY</div>
</div>
<script>
  const s = document.getElementById('screen'); applyTheme(s, 'hanko');
  paintWallpaper(document.getElementById('wp'), 'hanko', { cell: 4 });
  mountBar(document.getElementById('barhost'), Object.assign({}, DEFAULT_STATE, {
    app: 'Alacritty · floating', title: 'zsh <span class="dim">~/</span>',
  }));
  document.fonts.ready.then(() => document.body.dataset.ready = 1);
</script></body></html>
