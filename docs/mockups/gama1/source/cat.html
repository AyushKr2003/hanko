<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="gama.css"><script src="alpha.js"></script><script src="gama.js"></script>
<style>body{width:1600px;background:#0a0a09}.plate{padding:56px 64px 26px}
.eb{font-family:var(--mono);font-size:10px;letter-spacing:2.2px;color:var(--inkMuted);display:flex;gap:10px;align-items:center}.eb .jp{font-family:var(--jp);color:var(--seal);font-size:13px;letter-spacing:0}.eb .fill{flex:1;height:1px;background:var(--lineSoft)}
h1{font-family:var(--display);font-variation-settings:'opsz' 144;font-weight:400;font-size:60px;letter-spacing:-1.2px;margin:16px 0 10px}.lead{font-size:15px;color:var(--inkMuted);max-width:860px;line-height:1.5}
.grp{margin:34px 64px 8px;display:flex;align-items:baseline;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.grp .t{font-family:var(--display);font-size:28px}.grp .t .jp{font-family:var(--jp);font-size:14px;color:var(--seal);margin-left:8px}.grp .k{font-family:var(--mono);font-size:10px;letter-spacing:1.8px;color:var(--inkFaint)}
.strip{margin:0 64px 16px}.meta{display:flex;align-items:baseline;gap:12px;padding-bottom:7px}
.meta .o{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;color:var(--ink);text-transform:uppercase}.meta .o.def::after{content:'DEFAULT';margin-left:10px;font-size:8.5px;padding:2px 6px;background:var(--bone);color:var(--onBone);border-radius:2px}
.meta .d{font-size:12.5px;color:var(--inkMuted)}
.frame{position:relative;overflow:hidden;border-radius:3px}.frame canvas{position:absolute;left:0;top:0;width:1472px;height:828px}.frame .bh{position:relative;z-index:2}
.frame.btm{display:flex;flex-direction:column;justify-content:flex-end}
</style></head><body><div class="hk" id="root"><div class="plate" id="head"></div><div id="body"></div></div>
<script>
const q=new URLSearchParams(location.search);const PAGE=q.get('page');const TH=q.get('theme')||'hanko';
applyTheme(document.getElementById('root'),TH);document.body.style.background=THEMES[TH].background;
const DESC={
 seal:{stamp:'A fixed seal glyph (印 by default, any character you like). Click for the Omarchy menu.',workspace:'The seal is the active workspace as a kanji numeral. Scroll it to walk workspaces.',none:'No seal; the bar starts with your workspaces.'},
 spaces:{folio:'Page numbers. The live one inverts with a // lead; dots count windows.',layout:'Each workspace drawn as its real tiling, focused window filled.',kanji:'Kanji numerals 壱 弐 参 … with window dots; the live one inverts.',dots:'The quietest: dots, the live one a short bar.'},
 title:{cell:'App as a tracked label over the title, like a spec cell.',byline:'App in serif italic, title in grotesk, path receding.',none:'No window title at all.'},
 clock:{stacked:'Serif time, day and date stacked in mono beside it.',inline:'Serif time with a red colon and a small-caps date.',mono:'All mono, for an instrument look.'},
 clockAt:{center:'Clock anchored to the exact centre.',right:'Clock joins the right cluster; the centre stays empty.'},
 media:{cell:'Now playing as a label-over-value cell.',underline:'Song in serif; the underline is the progress bar.',none:'Hide media.'},
 status:{cells:'Label over value, ruled off by hairlines.',glyphs:'Kanji are the icons, the number is the state.',numerals:'Just mono labels and numbers on one line.'},
 meters:{ticks:'Quantities get a tick meter beside them.',off:'Numbers only.'},
 notif:{count:'A count with one red dot.',stamps:'Each notification lands as a stamped seal.'},
 edge:{hairline:'A single hairline.',dayrule:'A 24-hour ruler with a red now-notch.',rod:'The scroll roller with a grip. Pull to unroll.',rodrule:'The roller carries the day: ticks, spent part and now-notch.'},
 rules:{on:'Hairline dividers between groups.',off:'Groups separated by space alone.'},
 height:{32:'Compact. Cells collapse to one line.',36:'Regular.',40:'Roomy.',44:'Tall, for big screens.'},
 surface:{solid:'Opaque paper.',glass:'Paper at 74% over a blur.',inset:'Floats 8 px off the edges with a hairline frame.'},
 position:{top:'Top edge.',bottom:'Bottom edge; the edge detail flips to the top.'},
};
const NAMES={seal:['Seal','印'],spaces:['Workspaces','頁'],title:['Window title','窓'],clock:['Clock','時'],clockAt:['Clock position','中'],media:['Now playing','再生'],status:['Status','音'],meters:['Meters','目盛'],notif:['Notifications','報'],edge:['Bottom edge','軸'],rules:['Dividers','罫'],height:['Height','高'],surface:['Surface','面'],position:['Position','位']};
const PAGES={
 identity:{t:'Seal and workspaces',e:'印 · IDENTITY',l:'The left end says where you are. Pick how the seal and workspaces read; everything else stays on the Hanko preset.',axes:['seal','spaces']},
 time:{t:'Title and clock',e:'時 · TITLE, CLOCK',l:'What you are looking at, and when. Three title styles, three clocks, two clock positions.',axes:['title','clock','clockAt']},
 status:{t:'Status and meters',e:'音 · STATUS',l:'Network, sound and battery. Every status style works with or without tick meters, so this sheet shows all six pairs.',axes:['statusxmeters']},
 signals:{t:'Media and notifications',e:'報 · SIGNALS',l:'What is playing and what is waiting.',axes:['media','notif']},
 edge:{t:'Edge and dividers',e:'軸 · EDGE',l:'beta1 measured the day along the bar’s foot; alpha1 hung a scroll roller there. Hanko lets you pick either, or the roller that carries the day.',axes:['edge','rules']},
 presets:{t:'Six presets',e:'組 · PRESETS',l:'A preset is a starting point: pick one, then change any single setting. Sheet is beta1, Scroll is alpha1, Hanko is the merge.',axes:['presets']},
 shuffle:{t:'Shuffle',e:'乱 · TWELVE RANDOM COMBINATIONS',l:'Twelve combinations drawn at random from the 2,985,984 the settings allow. None of them is a preset; every one still reads as Hanko.',axes:['shuffle']},
 themes:{t:'Presets across themes',e:'色 · THEMES',l:'The ink comes from colors.toml, so every preset reprints on every Omarchy theme. Three presets on four themes.',axes:['themes']},
 frame:{t:'Height, surface, position',e:'面 · FRAME',l:'How much room the bar takes and how it sits on the desk.',axes:['height','surface','position']},
};
const P=PAGES[PAGE];
document.getElementById('head').innerHTML=`<div class="eb"><span class="jp">組</span>HANKO GAMA1 · COMPONENTS · ${P.e}<span class="fill"></span></div><h1>${P.t}</h1><div class="lead">${P.l}</div>`;
const body=document.getElementById('body');let n=0;
function strip(label,desc,opts,isDef,btm,th){th=th||TH;const id='s'+(n++);body.insertAdjacentHTML('beforeend',`<div class="strip"><div class="meta"><span class="o ${isDef?'def':''}">${label}</span><span class="d">${desc}</span></div><div class="frame hk ${btm?'btm':''}" id="${id}" style="height:${btm?96:84}px"><canvas width="1472" height="828"></canvas><div class="bh"></div></div></div>`);
 const f=document.getElementById(id);applyTheme(f,th);paintMarble(f.querySelector('canvas'),th,{cell:2,x:.74,y:btm?-.05:(opts.surface==='glass'?.04:.32),r:.26,sunDX:-1.05,sunDY:.5,sunR:.25});mountHB(f.querySelector('.bh'),opts);}
for(const ax of P.axes){
 if(ax==='presets'){const PD={Sheet:'beta1 as it shipped: folio pages, cells, the day rule, sheets that drop from a cell.',Scroll:'alpha1 as it shipped: layout glyphs, byline, kanji status, stamps, the rod and the handscroll.',Hanko:'The merge and the default: alpha1’s left end, beta1’s cells and meters, the roller that carries the day.',Quiet:'Almost nothing: dots, one inline clock, numerals, a hairline, glass. 32 px.',Instrument:'A spec sheet: kanji pages, mono clock on the right, every meter, 44 px.',Islet:'An inset floating strip with glyph status and stamps.'};
  for(const [k,v] of Object.entries(PRESETS)){body.insertAdjacentHTML('beforeend',`<div class="grp"><span class="t">${k}</span><span class="k">${Object.entries(v).map(([a,b])=>a+' '+b).join(' · ').toUpperCase()}</span></div>`);strip(k,PD[k],v,k==='Hanko',false);}continue;}
 if(ax==='shuffle'){let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(let i=0;i<12;i++){const o={};for(const [a,vs] of Object.entries(OPTS)){if(a==='position'||a==='panels')continue;o[a]=vs[Math.floor(rnd()*vs.length)];}
   strip('No. '+String(i+1).padStart(2,'0'),Object.entries(o).map(([a,b])=>a+' '+b).join(' · '),o,false,false);}continue;}
 if(ax==='themes'){for(const th of ['hanko','tokyo-night','gruvbox','rose-pine']){body.insertAdjacentHTML('beforeend',`<div class="grp"><span class="t">${THEMES[th].name}</span><span class="k">${THEMES[th].mode.toUpperCase()} · ${THEMES[th].background} / ${THEMES[th].foreground} / ${THEMES[th].red}</span></div>`);
   for(const k of ['Sheet','Hanko','Islet'])strip(k,'',PRESETS[k],false,false,th);}continue;}
 if(ax==='statusxmeters'){body.insertAdjacentHTML('beforeend',`<div class="grp"><span class="t">Status × meters<span class="jp">音</span></span><span class="k">3 × 2 = 6</span></div>`);
  for(const s of OPTS.status)for(const m of OPTS.meters)strip(`${s} · ${m}`,`${DESC.status[s]} ${DESC.meters[m]}`,{status:s,meters:m},s===PRESETS.Hanko.status&&m===PRESETS.Hanko.meters);continue;}
 body.insertAdjacentHTML('beforeend',`<div class="grp"><span class="t">${NAMES[ax][0]}<span class="jp">${NAMES[ax][1]}</span></span><span class="k">${OPTS[ax].length} OPTIONS · hanko.${ax}</span></div>`);
 for(const v of OPTS[ax])strip(String(v),DESC[ax][v],{[ax]:v},String(PRESETS.Hanko[ax]??'top')===String(v),ax==='position'&&v==='bottom');
}
document.fonts.ready.then(()=>document.body.dataset.ready=1)
</script></body></html>
