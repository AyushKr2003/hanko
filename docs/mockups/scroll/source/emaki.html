<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="scroll.css"><script src="scroll.js"></script>
<style>body{width:1600px;height:900px;overflow:hidden}#s{position:relative;width:1600px;height:900px;overflow:hidden}canvas.wp{position:absolute;inset:0;width:1600px;height:900px}#b{position:absolute;top:0;left:0;right:0;z-index:7}
.scrim{position:absolute;inset:0;z-index:2}</style></head><body>
<div id="s" class="hk"><canvas class="wp" id="wp" width="1600" height="900"></canvas><div class="scrim" id="sc"></div><div id="b"></div>
<div class="emaki" id="e" style="z-index:6;left:110px;width:1380px;top:40px;height:460px"></div></div>
<script>
const q=new URLSearchParams(location.search);const TH=q.get('theme')||'hanko';const F=+(q.get('focus')||1);
const S=document.getElementById('s');applyTheme(S,TH);paintMarble(document.getElementById('wp'),TH,{cell:2});
document.getElementById('sc').style.background=THEMES[TH].mode==='dark'?'rgba(0,0,0,.35)':'rgba(0,0,0,.08)';
mountBar(document.getElementById('b'),{rodLive:true,rodLabel:'ESC · ROLL UP',fan:q.get('fan')==='1'});
const all=['time','sound','net','power','spaces','inbox'],W={time:600,sound:660,net:540,power:420,spaces:700,inbox:560};
const e=document.getElementById('e');e.innerHTML=emakiHTML(all,all.map(k=>W[k]),F);
e.querySelectorAll('.inter canvas').forEach(c=>{c.height=386;paintSliver(c,TH,+c.dataset.seed+1)});
const view=e.querySelector('.view'),tr=e.querySelector('.track');const s1=tr.querySelectorAll('.sec')[F];
const place=()=>tr.style.left=(view.clientWidth/2-(s1.offsetLeft+s1.offsetWidth/2)+(+(q.get('nudge')||0)))+'px';place();
const HF=+(q.get('h')??1),INK=+(q.get('ink')??1);
if(HF<1){e.style.height=(460*HF)+'px';e.style.overflow='hidden';}
e.querySelectorAll('.sec,.inter,.idx,.foot').forEach(x=>x.style.opacity=INK);
if(q.get('closed')==='1'){e.style.display='none';document.getElementById('sc').style.background='transparent';}
if(q.get('stamp')){const sts=document.querySelectorAll('.stamps .st'),st=sts[sts.length-1];st.style.transform=q.get('stamp');}
document.fonts.ready.then(()=>{place();document.body.dataset.ready=1})
</script></body></html>
