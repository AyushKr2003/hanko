<!doctype html>
<html><head><meta charset="utf-8"><title>Hanko · Kata playground</title>
<link rel="stylesheet" href="kata.css">
<style>
  body { display: grid; grid-template-columns: 340px 1600px; min-height: 100vh; background: #0b0b0a; color: #e9e1d2; }
  #dock { padding: 22px 20px; font-size: 12.5px; color: #a8a196; border-right: 1px solid #22201c; overflow: auto; height: 100vh; position: sticky; top: 0; }
  #dock h1 { font: 380 26px/1 Fraunces, serif; color: #f1eadd; margin-bottom: 4px; } #dock .sub { color: #7d776d; margin-bottom: 18px; }
  #dock h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7d776d; margin: 18px 0 8px; font-weight: 500; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 10px; }
  .opts button { font: 500 12px Grotesk, sans-serif; background: transparent; color: #a8a196; border: 1px solid #2c2a26; padding: 5px 8px; cursor: pointer; }
  .opts button.on { background: #e9e1d2; color: #0e0d0b; border-color: #e9e1d2; }
  .opts button i { font-style: normal; font-size: 10px; opacity: .6; margin-left: 4px; }
  .lab { display: flex; justify-content: space-between; color: #d8d0c2; } .lab span { color: #7d776d; }
  #name { margin-top: 18px; padding: 10px 12px; border: 1px solid #2c2a26; color: #f1eadd; line-height: 1.45; }
  #json { margin-top: 8px; font: 11.5px/1.5 "JetBrains Mono", monospace; color: #a8a196; white-space: pre-wrap; }
  #s { width: 1600px; height: 900px; }
</style></head>
<body>
<aside id="dock"><h1>Kata 型</h1><div class="sub">One engine. Pick a design, borrow parts, watch the bar change. Click the seal, volume or battery to open a panel.</div><div id="ctl"></div><div id="name"></div><div id="json"></div></aside>
<div id="s"></div>
<script type="module">
import { PARTS, TOUCHES, DESIGNS, THEMES, resolve, describe, surprise, desk, openPanel, closePanel } from './kata.js';
let doc = { design: 'shoji', borrow: {}, touches: {} }, theme = 'hanko', panel = 'sound';
const el = document.getElementById('s'), ctl = document.getElementById('ctl');
const B = (on, label, fn, sub = '') => { const b = document.createElement('button'); b.className = on ? 'on' : ''; b.innerHTML = label + (sub ? `<i>${sub}</i>` : ''); b.onclick = fn; return b; };
function group(title, items) { const h = document.createElement('h2'); h.textContent = title; ctl.append(h); const o = document.createElement('div'); o.className = 'opts'; items.forEach(i => o.append(i)); ctl.append(o); }
function render() {
  const st = resolve(doc); ctl.innerHTML = '';
  group('Design', [...Object.entries(DESIGNS).map(([k, D]) => B(doc.design === k && !Object.keys(doc.borrow).length, D.name, () => { doc = { design: k, borrow: {}, touches: {} }; render(); })), B(false, '⤨ Surprise', () => { doc = { ...surprise(), touches: {} }; render(); })]);
  for (const [k, p] of Object.entries(PARTS)) {
    const lab = document.createElement('div'); lab.className = 'lab'; lab.innerHTML = `${p.name}<span>${p.main ? '' : 'auto → ' + p.v[st[k]][0]}</span>`; ctl.append(lab);
    const o = document.createElement('div'); o.className = 'opts';
    if (!p.main) o.append(B(!doc.borrow[k] || doc.borrow[k] === 'auto', 'auto', () => { delete doc.borrow[k]; render(); }));
    for (const [v, [nm, by]] of Object.entries(p.v)) o.append(B(st[k] === v && (p.main || doc.borrow[k] === v), nm, () => { if (p.main && DESIGNS[doc.design].parts[k] === v) delete doc.borrow[k]; else doc.borrow[k] = v; render(); }, DESIGNS[by]?.name));
    ctl.append(o);
  }
  group('Touches', Object.entries(TOUCHES).flatMap(([k, t]) => t.v.map(v => B(st.touches[k] === v, v, () => { doc.touches[k] = v; render(); }, t.name.split(' ')[0]))));
  group('Theme', Object.entries(THEMES).map(([k, t]) => B(theme === k, t.name, () => { theme = k; render(); })));
  group('Panel', ['sound', 'power', 'inbox'].map(k => B(panel === k, k, () => { panel = k; render(); })));
  document.getElementById('name').innerHTML = describe(st);
  document.getElementById('json').textContent = JSON.stringify({ design: doc.design, ...(Object.keys(doc.borrow).length ? { borrow: doc.borrow } : {}), ...(Object.keys(doc.touches).length ? { touches: doc.touches } : {}) }, null, 1);
  desk(el, st, { theme, panel, windows: true });
  el.querySelectorAll('[data-panel]').forEach(a => a.onclick = e => { e.stopPropagation(); const k = a.dataset.panel; if (!['sound', 'power', 'inbox'].includes(k)) return; const open = el.querySelector('.panel'); if (open && open.dataset.key === k) { closePanel(el); panel = null; } else { panel = k; openPanel(el, st, k); } });
}
render(); document.fonts.ready.then(() => setTimeout(() => document.body.dataset.ready = 1, 300));
</script></body></html>
