<!doctype html>
<html><head><meta charset="utf-8"><title>Hanko · Kata — sheets</title>
<link rel="stylesheet" href="kata.css">
<style>
  .sheet { width: 1600px; padding: 56px 64px 64px; }
  .sheet h1 { font-family: "Fraunces", serif; font-weight: 340; font-size: 44px; letter-spacing: -.025em; font-variation-settings: "opsz" 120, "SOFT" 20; display: flex; gap: 16px; align-items: baseline; }
  .sheet h1 .jp { font-size: 30px; color: var(--ink3); font-weight: 400; }
  .sheet .lede { color: var(--ink3); font-size: 15px; margin-top: 10px; max-width: 980px; line-height: 1.55; }
  .sheet .lede b { color: var(--ink2); font-weight: 500; }
  .sheet h2 { font-size: 13px; color: var(--ink3); font-weight: 500; margin: 42px 0 14px; display: flex; gap: 12px; align-items: center; }
  .sheet h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .equ { display: grid; grid-template-columns: 1fr 40px 1.25fr 40px .8fr 40px 1fr; align-items: stretch; }
  .equ .op { display: grid; place-items: center; font-family: "Fraunces", serif; font-size: 34px; color: var(--ink3); }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .box h3 { font-weight: 500; font-size: 15px; display: flex; align-items: baseline; gap: 10px; } .box h3 span { font-size: 12px; color: var(--ink3); font-weight: 400; }
  .box ul { list-style: none; margin-top: 12px; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--ink2); }
  .box ul li { display: flex; gap: 8px; } .box ul li::before { content: "—"; color: var(--ink4); }
  .box .chipsx { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .box .chipsx span { font-size: 12px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink2); }
  .box .chipsx span.p { color: var(--ink3); border-style: dashed; }
  .cells { display: grid; gap: 16px; }
  .cell { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
  .cell .inner { position: absolute; top: 0; width: 1600px; }
  .cap { font-size: 12.5px; color: var(--ink3); margin: 0 0 8px; } .cap b { color: var(--ink); font-weight: 500; font-size: 14px; margin-right: 8px; }
  .code2 { font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 1.6; color: var(--ink2); background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; white-space: pre; margin-top: 8px; }
  .code2 .s { color: color-mix(in srgb, var(--red) 70%, var(--ink)); } .code2 .c { color: var(--ink3); }
  .gal { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .grow { display: grid; grid-template-columns: 210px repeat(3, 1fr); border-top: 1px solid var(--line); }
  .grow:first-child { border-top: 0; }
  .grow > div { padding: 10px 14px; border-left: 1px solid var(--line); display: flex; align-items: center; gap: 12px; min-height: 66px; }
  .grow > div:first-child { border-left: 0; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; }
  .grow .nm { font-weight: 500; font-size: 14px; } .grow .nt2 { font-size: 12px; color: var(--ink3); }
  .grow .vn { font-size: 12px; color: var(--ink2); min-width: 92px; } .grow .vn span { display: block; font-size: 10.5px; color: var(--ink3); }
  .grow.head > div { min-height: 40px; font-size: 12px; color: var(--ink3); font-weight: 500; }
  .grow.partner { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  .arch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: stretch; }
  .arch .box { position: relative; } .arch .box code { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--ink); }
  .arch .box p { font-size: 12.5px; color: var(--ink3); margin-top: 8px; line-height: 1.5; }
  .arrow { position: absolute; right: -14px; top: 50%; width: 14px; height: 1px; background: var(--ink4); }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .levels .box .n { font-family: "Fraunces", serif; font-size: 40px; font-variation-settings: "opsz" 96; color: var(--ink); line-height: 1; }
  .levels .box p { font-size: 13px; color: var(--ink2); margin-top: 8px; line-height: 1.5; } .levels .box .who { font-size: 12px; color: var(--ink3); margin-top: 10px; }
</style></head>
<body class="still"><div class="sheet k" id="root" data-surface="paper" data-corner="soft" data-divider="hairline"></div>
<script type="module">
import { PARTS, AUTO, TOUCHES, DESIGNS, resolve, describe, tokens, applyTokens, desk, swatch, settingsPage } from './kata.js';
const q = new URLSearchParams(location.search), page = q.get('page') || 'idea', root = document.getElementById('root');
applyTokens(root, tokens(q.get('theme') || 'hanko', 'smooth')); root.style.background = 'var(--paper)';

// a crop of a real desk: the same engine, a given style, a panel open
function cell(doc, panel, { w = 480, h = 640, x = 'right', theme = 'hanko', label = '', sub = '' } = {}) {
  const st = resolve(doc), box = document.createElement('div');
  box.innerHTML = `${label ? `<div class="cap"><b>${label}</b>${sub}</div>` : ''}<div class="cell" style="width:${w}px;height:${h}px"><div class="inner" style="height:${h}px;${x === 'right' ? `left:${w - 1600}px` : 'left:0'}"></div></div>`;
  return { box, go: () => desk(box.querySelector('.inner'), st, { theme, panel, windows: false, h }) };
}

const PAGES = {
  idea() {
    const shared = ['The bar’s anatomy: seal · desks · window | time | playing · status', 'One panel at a time, anchored to what you touched', 'The same panel contents (Sound, Time, Network, Power, Letters)', 'Red means “for you” — nothing else', 'Serif figures, sans words; inks solved by contrast', 'Motion by frequency; Undo instead of Save', 'Every colour from the Omarchy theme'];
    const mains = Object.keys(PARTS).filter(k => PARTS[k].main), partners = Object.keys(PARTS).filter(k => !PARTS[k].main);
    root.innerHTML = `<h1>Kata <span class="jp">型</span></h1>
    <div class="lede">Margin, Leaf and Shōji look different, but they already agree on <b>most of what matters</b>: the same bar, the same one-panel model, the same content, the same rules. They differ in about a dozen small, swappable <b>parts</b>. So a design is not a separate program — it is a <b>preset over those parts</b>, exactly the way Hanko already resolves a preset → edits → per-monitor overrides. One engine draws all three, and any mix of them.</div>
    <h2>The idea</h2>
    <div class="equ">
      <div class="box"><h3>Skeleton <span>shared, never changes</span></h3><ul>${shared.map(s => `<li>${s}</li>`).join('')}</ul></div><div class="op">+</div>
      <div class="box"><h3>Parts <span>${mains.length} choices, ${partners.length} partners that follow</span></h3><div class="chipsx">${mains.map(k => `<span>${PARTS[k].name}</span>`).join('')}${partners.map(k => `<span class="p">${PARTS[k].name} · auto</span>`).join('')}</div>
        <ul style="margin-top:14px"><li>each part has one variant from each design</li><li>partners (corners, dividers, tempo) follow the part they belong with, so a mix stays coherent</li></ul></div><div class="op">+</div>
      <div class="box"><h3>Touches <span>switches</span></h3><ul>${Object.values(TOUCHES).map(t => `<li>${t.name}</li>`).join('')}</ul></div><div class="op">=</div>
      <div class="box"><h3>A design</h3><ul>${Object.entries(DESIGNS).map(([k, D]) => `<li><b style="color:var(--ink);font-weight:500">${D.name}</b>&nbsp;${D.blurb}</li>`).join('')}<li>…or yours: “Shōji with Margin’s slider”</li></ul></div>
    </div>
    <h2>The same Sound panel, one engine, three presets</h2>
    <div class="cells" style="grid-template-columns:repeat(3,1fr)" id="three"></div>
    <h2>Do we need complex settings? No — three levels, and most people stop at the first</h2>
    <div class="levels">
      <div class="box"><div class="n">1</div><h3 style="margin-top:8px">Pick a design</h3><p>Three big pictures of your own bar: Margin, Leaf, Shōji (and Classic for today’s Typeset bar). One click. Everything else follows.</p><div class="who">Almost everyone</div></div>
      <div class="box"><div class="n">9</div><h3 style="margin-top:8px">Borrow a part</h3><p>One page, nine rows. Each row shows one part drawn three ways — one per design. Click the one you like. Corners, dividers and tempo follow by themselves.</p><div class="who">People who like to tinker</div></div>
      <div class="box"><div class="n">{ }</div><h3 style="margin-top:8px">Write it down</h3><p><code>style.json</code> and <code>hanko design</code> / <code>hanko borrow</code>: the same two ideas as text, plus per-monitor overrides Hanko already supports. Override a partner by hand if you really want to.</p><div class="who">Dotfile people, scripts</div></div>
    </div>`;
    const go = [];
    for (const k of Object.keys(DESIGNS)) { const c = cell({ design: k }, 'sound', { w: 474, h: 700, label: DESIGNS[k].name, sub: DESIGNS[k].blurb }); document.getElementById('three').append(c.box); go.push(c.go); }
    go.forEach(f => f());
  },

  parts() {
    const order = ['margin', 'leaf', 'shoji'];
    const rowFor = k => { const p = PARTS[k]; return `<div class="grow${p.main ? '' : ' partner'}"><div><span class="nm">${p.name}</span><span class="nt2">${p.main ? p.note : `follows ${PARTS[p.follows].name.toLowerCase()} unless set`}</span></div>${order.map(dn => { const v = Object.keys(p.v).find(x => p.v[x][1] === dn); return `<div>${v ? `${p.main ? swatch(k, v) : ''}<span class="vn">${p.v[v][0]}<span>${p.main ? '' : 'auto with ' + Object.entries(AUTO[k]).filter(([, x]) => x === v).map(([s]) => PARTS[p.follows].v[s][0].toLowerCase()).join(', ')}</span></span>` : '<span class="vn" style="color:var(--ink4)">— (uses Margin’s)</span>'}</div>`; }).join('')}</div>`; };
    root.innerHTML = `<h1>The parts <span class="jp">部品</span></h1>
    <div class="lede">Every place the three designs differ, reduced to one part with one variant from each. These are the only things a design decides; the rest is the shared skeleton. The shaded rows are <b>partners</b>: they default to <i>auto</i> and follow the part they belong with (a card is cut square and creased, a rail moves to jo-ha-kyū), so no mix ends up with soft corners on hard-shadowed card by accident — unless you ask for it.</div>
    <h2>Main parts and partners</h2>
    <div class="gal"><div class="grow head"><div>Part</div><div>from Margin</div><div>from Leaf</div><div>from Shōji</div></div>${Object.keys(PARTS).map(rowFor).join('')}</div>
    <h2>Touches — switches that work with every design</h2>
    <div class="gal">${Object.entries(TOUCHES).map(([k, t]) => `<div class="grow" style="grid-template-columns:210px 1fr"><div><span class="nm">${t.name}</span></div><div style="gap:8px">${t.v.map(x => `<span class="vn" style="min-width:0;padding:5px 10px;border:1px solid var(--line);border-radius:6px">${x}</span>`).join('')}<span class="nt2" style="margin-left:12px">${{ season: 'Shōji turns it on; any design can show 寒露 / Cold dew by the clock', numerals: '1 2 3 or 一 二 三, in any design', grain: 'Leaf and Shōji use fine grain; Margin is smooth' }[k]}</span></div></div>`).join('')}</div>`;
  },

  compare() {
    root.innerHTML = `<h1>One engine, three designs</h1><div class="lede">Every cell below is drawn by the same code from the same content. Only the preset changes. Rows: Sound (slider, selection, dividers, sign), Power (battery ring, segmented control, chips), Letters (unread marks, the seal).</div><h2>Sound · Power · Letters</h2><div class="cells" style="grid-template-columns:repeat(3,1fr)" id="g"></div>`;
    const go = [];
    for (const [panel, x, h] of [['sound', 'right', 690], ['power', 'right', 560], ['inbox', 'left', 520]])
      for (const k of Object.keys(DESIGNS)) { const c = cell({ design: k }, panel, { w: 474, h, x, label: panel === 'sound' ? DESIGNS[k].name : '', sub: panel === 'sound' ? DESIGNS[k].blurb : '' }); document.getElementById('g').append(c.box); go.push(c.go); }
    go.forEach(f => f());
  },

  mixes() {
    const M = [
      [{ design: 'shoji', borrow: { slider: 'ruler', ring: 'glyph' } }, 'sound', 'right', 'For someone who loves Shōji’s washi and seasons, but wants a precise ruler and a plain battery.'],
      [{ design: 'leaf', borrow: { slider: 'brush', unread: 'stamp' }, touches: { season: 'kanji' } }, 'inbox', 'left', 'Leaf’s sharp card with Shōji’s brush, its 未 stamps and the season by the clock.'],
      [{ design: 'margin', borrow: { sign: 'tategaki', ring: 'enso' } }, 'power', 'right', 'Margin’s calm, soft paper with a vertical sign and an ensō battery.'],
      [{ design: 'shoji', borrow: { surface: 'card', arrive: 'slip' } }, 'sound', 'right', 'Shōji’s brush and seal on Leaf’s card: corners, dividers and tempo followed the borrowed parts by themselves.'],
    ];
    root.innerHTML = `<h1>Mixes</h1><div class="lede">A mix is a design plus a few borrowed parts. Each one below is a real style document; the engine resolves partners automatically, and the name is generated from what was borrowed.</div><h2>Four mixes</h2><div class="cells" style="grid-template-columns:repeat(2,1fr);gap:28px" id="m"></div>`;
    const go = [];
    for (const [doc, panel, x, why] of M) {
      const st = resolve(doc), c = cell(doc, panel, { w: 720, h: 640, x, label: describe(st), sub: '' });
      const json = JSON.stringify({ design: doc.design, borrow: doc.borrow, ...(doc.touches ? { touches: doc.touches } : {}) }).replace(/"(\w+)":/g, '$1: ').replace(/,/g, ', ');
      c.box.insertAdjacentHTML('beforeend', `<div class="lbl2" style="font-size:12.5px;color:var(--ink3);margin-top:8px">${why}</div><div class="code2">${json.replace(/"([^"]+)"/g, '<span class="s">"$1"</span>')}</div>`);
      document.getElementById('m').append(c.box); go.push(c.go);
    }
    go.forEach(f => f());
  },

  build() {
    root.innerHTML = `<h1>Building it in Hanko</h1><div class="lede">The architecture Hanko already has — services → <code>BarWindow</code> → pure <code>BarSurface</code> → components, rendered by the harness — gets one new layer: <b>part facades</b>. Panel content is written once against the facades; each facade loads the variant the style asks for.</div>
    <h2>Four layers</h2>
    <div class="arch">
      <div class="box"><h3>1 · Style</h3><p><code>core/Kata.js</code> (pure JS, Node-tested): <code>PARTS</code>, <code>DESIGNS</code>, <code>AUTO</code>, <code>TOUCHES</code>, <code>resolve(doc, monitor)</code>, <code>surprise()</code>, <code>describe()</code>. It replaces <code>Style.js</code>’s 22 options; <code>Typeset.qml</code> keeps loading <code>style.json</code> and the per-monitor layer.</p><i class="arrow"></i></div>
      <div class="box"><h3>2 · Skin</h3><p><code>core/Skin.qml</code> singleton: the resolved parts plus their tokens — corner radii, divider kind, curves and durations for the tempo, figure SOFT axis. <code>Ink.qml</code> gains Leaf’s material tokens (cut, edge, shade, score) and Shōji’s washi.</p><i class="arrow"></i></div>
      <div class="box"><h3>3 · Part facades</h3><p>One file per part, same API whatever the variant: <code>Surface</code>, <code>Divider</code>, <code>PointerMark</code>, <code>Selection</code>, <code>Slider</code>, <code>Ring</code>, <code>Seal</code>, <code>UnreadMark</code>, <code>Sign</code>, <code>PanelWindow</code> (arrive + tempo). Each is a <code>Loader</code> picking <code>parts/slider/Ruler.qml</code>, <code>Block.qml</code> or <code>Brush.qml</code>.</p><i class="arrow"></i></div>
      <div class="box"><h3>4 · Content</h3><p><code>panels/Sound.qml</code>, <code>Power.qml</code>, <code>Letters.qml</code>, … and the bar’s zones use only facades and data (<code>Sound.js</code>, <code>Power.js</code> …). Written once, they appear in every design and every mix.</p></div>
    </div>
    <h2>The style document and the commands</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div><div class="cap"><b>~/.config/hanko/style.json</b></div><div class="code2">{
  <span class="s">"design"</span>: <span class="s">"shoji"</span>,
  <span class="s">"borrow"</span>: { <span class="s">"slider"</span>: <span class="s">"ruler"</span> },        <span class="c">// optional</span>
  <span class="s">"touches"</span>: { <span class="s">"season"</span>: <span class="s">"english"</span> },  <span class="c">// optional</span>
  <span class="s">"monitors"</span>: { <span class="s">"DP-2"</span>: { <span class="s">"design"</span>: <span class="s">"margin"</span> } }
}</div><div class="lbl2" style="font-size:12.5px;color:var(--ink3);margin-top:8px">Old files keep working: a document with a <code>preset</code> and the 22 Typeset keys resolves to the <b>Classic</b> design through today’s code path, untouched.</div></div>
      <div><div class="cap"><b>CLI / IPC</b></div><div class="code2">hanko design shoji          <span class="c"># pick a design</span>
hanko borrow slider ruler   <span class="c"># take one part</span>
hanko borrow slider auto    <span class="c"># give it back</span>
hanko touch season english
hanko design surprise       <span class="c"># a coherent random mix</span>
hanko design describe       <span class="c"># → "Shōji with Margin’s slider"</span></div></div>
    </div>
    <h2>How one part is built — the slider</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="code2"><span class="c">// parts/Slider.qml — the facade every panel uses</span>
Item {
  property real value; property bool thin; property bool muted
  signal moved(real value)
  Loader {
    anchors.fill: parent
    source: <span class="s">"slider/"</span> + Skin.slider + <span class="s">".qml"</span>   <span class="c">// ruler | block | brush</span>
    onLoaded: item.bind(parent)       <span class="c">// value, thin, muted, moved</span>
  }
}</div>
      <div class="code2"><span class="c">// panels/Sound.qml — written once, for every design</span>
Column {
  Figure  { value: Sound.volume }
  Slider  { value: Sound.volume; onMoved: v => Sound.set(v) }
  Divider {}
  Heading { text: qsTr(<span class="s">"Plays on"</span>) }
  Choices { model: Sound.outputs }   <span class="c">// uses Selection</span>
}</div>
    </div>
    <h2>Testing every combination</h2>
    <div class="lede" style="margin-top:0">The harness renders each panel × each design (and a few named mixes) into one grid, so a change to a part is seen everywhere it appears. <code>Kata.js</code> gets unit tests: every design resolves without warnings, partners follow, unknown values fall back with a warning, old Typeset documents resolve to Classic, and <code>surprise()</code> never produces an unknown value.</div>`;
  },

  settings() {
    root.style.padding = '0'; root.style.width = '1600px'; root.style.height = '900px'; root.className = 'k';
    const st = resolve({ design: 'shoji', borrow: { slider: 'ruler' } });
    desk(root, st, { windows: true }); settingsPage(root, st);
  },
};
PAGES[page]();
document.fonts.ready.then(() => setTimeout(() => document.body.dataset.ready = 1, 400));
</script></body></html>
